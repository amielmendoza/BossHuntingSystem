<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Boss Hunting System</h2>
      <p class="text-muted">Sign in to your account</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="alert alert-danger" *ngIf="errorMessage" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ errorMessage }}
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          [disabled]="isLoading"
          required
          autocomplete="username"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          [disabled]="isLoading"
          required
          autocomplete="current-password"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="isLoading || !username || !password"
      >
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Signing In...</span>
      </button>
    </form>

    <div class="login-footer">
      <small class="text-muted">
        Default credentials for testing:<br>
        <strong>SuperAdmin:</strong> superadmin / SuperAdmin&#64;123<br>
        <strong>Admin:</strong> admin / Admin&#64;123<br>
        <span class="text-danger">⚠️ Change default passwords immediately!</span>
      </small>
    </div>
  </div>
</div>
